<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Deep background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1e3a"/>
      <stop offset="100%" stop-color="#050b18"/>
    </radialGradient>

    <!-- Blue glow gradient for ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Inner shield gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112244"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>

    <!-- Neon text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow filter -->
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#2563eb" flood-opacity="0.5"/>
    </filter>

    <!-- Clip for outer ring segments -->
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="175"/>
    </clipPath>
  </defs>

  <!-- BG Circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bgGrad)"/>

  <!-- Grid lines subtle -->
  <g opacity="0.06" stroke="#2563eb" stroke-width="1">
    <line x1="50" y1="200" x2="350" y2="200"/>
    <line x1="200" y1="50" x2="200" y2="350"/>
    <line x1="95" y1="95" x2="305" y2="305"/>
    <line x1="305" y1="95" x2="95" y2="305"/>
  </g>

  <!-- Outer ring segments with gaps -->
  <g filter="url(#glow)">
    <!-- Top arc -->
    <path d="M 200 30 A 170 170 0 0 1 340 115" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Right arc -->
    <path d="M 355 160 A 170 170 0 0 1 355 240" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Bottom arc -->
    <path d="M 340 285 A 170 170 0 0 1 200 370" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Left arc -->
    <path d="M 60 285 A 170 170 0 0 1 45 200" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Top-left arc -->
    <path d="M 60 115 A 170 170 0 0 1 200 30" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Rotating dots at segment joints -->
  <g fill="#06b6d4" filter="url(#glow)">
    <circle cx="200" cy="30" r="5"/>
    <circle cx="340" cy="115" r="5"/>
    <circle cx="355" cy="200" r="5"/>
    <circle cx="340" cy="285" r="5"/>
    <circle cx="200" cy="370" r="5"/>
    <circle cx="60" cy="285" r="5"/>
    <circle cx="45" cy="200" r="5"/>
    <circle cx="60" cy="115" r="5"/>
  </g>

  <!-- Middle ring thin -->
  <circle cx="200" cy="200" r="148" fill="none" stroke="rgba(37,99,235,0.2)" stroke-width="1"/>

  <!-- Inner filled circle -->
  <circle cx="200" cy="200" r="140" fill="url(#shieldGrad)"/>

  <!-- Phone icon stylized -->
  <g filter="url(#strongGlow)" transform="translate(200,200)">
    <!-- Phone body -->
    <rect x="-28" y="-42" width="56" height="76" rx="10" fill="none" stroke="url(#ringGrad)" stroke-width="3"/>
    <!-- Screen -->
    <rect x="-20" y="-32" width="40" height="52" rx="5" fill="rgba(37,99,235,0.15)" stroke="rgba(96,165,250,0.3)" stroke-width="1"/>
    <!-- Signal waves -->
    <path d="M -14 -18 Q 0 -30 14 -18" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M -9 -12 Q 0 -20 9 -12" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="0" cy="-7" r="3" fill="#06b6d4"/>
    <!-- Bottom lines representing digits -->
    <rect x="-12" y="8" width="24" height="3" rx="1.5" fill="rgba(96,165,250,0.6)"/>
    <rect x="-8" y="15" width="16" height="3" rx="1.5" fill="rgba(96,165,250,0.4)"/>
    <!-- Home button -->
    <circle cx="0" cy="26" r="4" fill="none" stroke="rgba(96,165,250,0.5)" stroke-width="1.5"/>
  </g>

  <!-- VN monogram subtle behind text -->
  <text x="200" y="218" text-anchor="middle" font-family="'Arial Black', sans-serif"
    font-size="90" font-weight="900" fill="rgba(37,99,235,0.07)" letter-spacing="-4">VN</text>

  <!-- VIRTUAL text top -->
  <text x="200" y="293"
    text-anchor="middle"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-size="15" font-weight="700"
    fill="url(#textGrad)"
    letter-spacing="8"
    filter="url(#glow)">VIRTUAL</text>

  <!-- NUMBERS text bottom -->
  <text x="200" y="313"
    text-anchor="middle"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-size="15" font-weight="700"
    fill="url(#textGrad)"
    letter-spacing="8"
    filter="url(#glow)">NUMBERS</text>

  <!-- Divider line under text -->
  <line x1="130" y1="320" x2="270" y2="320" stroke="url(#ringGrad)" stroke-width="1" opacity="0.5"/>

  <!-- الحاوي & ريفالدو Arabic text -->
  <text x="200" y="340"
    text-anchor="middle"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-size="13" font-weight="600"
    fill="rgba(148,175,212,0.8)"
    letter-spacing="2">الحاوي &amp; ريفالدو</text>

  <!-- Outer border ring -->
  <circle cx="200" cy="200" r="193" fill="none" stroke="rgba(37,99,235,0.15)" stroke-width="1.5"/>

  <!-- Corner decorations -->
  <g fill="none" stroke="rgba(37,99,235,0.4)" stroke-width="1.5" stroke-linecap="round">
    <!-- Top-right corner -->
    <path d="M 340 70 L 355 70 L 355 85"/>
    <!-- Bottom-left corner -->
    <path d="M 60 330 L 45 330 L 45 315"/>
    <!-- Top-left corner -->
    <path d="M 60 70 L 45 70 L 45 85"/>
    <!-- Bottom-right corner -->
    <path d="M 340 330 L 355 330 L 355 315"/>
  </g>
</svg>
